<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Segoe UI, sans-serif;
            background: #f5f5f5;
        }
        h1 {
            color: #8b1d2c;
            font-size: 36px;
            animation: blink 0.6s ease-in-out 3;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <h1>✅ Login Verified</h1>
</body>
</html>
